name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cache
          POSTGRES_PASSWORD: cache
          POSTGRES_DB: cache_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cache -d cache_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      CACHE_TEST_DATABASE_URL: postgresql+psycopg://cache:cache@127.0.0.1:5433/cache_test
      CACHE_POSTGRES_PORT: 5434
      CACHE_HTTP_PORT: 8001
      COMPOSE_PROJECT_NAME: payload-cache-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.13.16"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -W error
      - name: Build and start the application
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check the deployed API and CLI
        run: uv run python scripts/smoke.py http://127.0.0.1:8001
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
